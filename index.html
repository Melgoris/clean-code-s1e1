<!DOCTYPE html>
<html>

  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>

  <body>
    <header class="header">
      <h1 class="header__title hide">Todo App</h1>
      <figure>
        <img
        src="./eisenhower-matrix.jpg" 
        alt="Eisenhower matrix"
        >
        <figcaption class="hide">Eisenhower priority matrix — link to method</figcaption>
      </figure>
      
      <a 
        class="header__info-link" 
        target="_blank"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    
    <main class="todo-app">
      <section class="todo-app__add-item">
        <label for="new-task">Add Item</label>
        <div class="todo-app__task-wrapper">
          <input 
            id="new-task" 
            class="todo-app__add-task"
            type="text"
          >
          <button>Add</button>
        </div>
      </section>

      <section class="todo-app__todo">
        <h2>Todo</h2>
        <ul class="todo-app__todo-list">
          <li>
            <article class="todo-app__item">
              <input type="checkbox">
              <label class="todo-app__task-label">Pay Bills</label>
              <input type="text" class="todo-app__task-input">
              <button class="todo-app__btn-edit">Edit</button>
              <button class="todo-app__btn-delete">
                <img 
                  src="./remove.svg" 
                  alt="Remove"
                >
              </button>
            </article>
          </li>

          <li class="editMode">
            <article class="todo-app__item">
              <input type="checkbox">
              <label class="todo-app__task-label">Go Shopping</label>
              <input
                type="text" 
                value="Go Shopping" 
                class="todo-app__task-input"
              >
              <button class="todo-app__btn-edit">Save</button>
              <button class="todo-app__btn-delete">
              <img 
                src="./remove.svg" 
                alt="Remove"
              >
              </button>
            </article>
          </li>
        </ul>
      </section>

      <section class="todo-app__completed">
        <h2>Completed</h2>
        <ul class="todo-app__completed-tasks">
          <li>
            <article class="todo-app__item">
              <input type="checkbox" checked>
              <label class="todo-app__task-label">See the Doctor</label>
              <input type="text" class="todo-app__task-input">
              <button class="todo-app__btn-edit">Edit</button>
              <button class="todo-app__btn-delete">
              <img 
                src="./remove.svg" 
                alt="Remove"
              >
              </button>
            </article>
          </li>
        </ul>
      </section>
      
      <aside class="hide">
        <p>A simple Todo list where you can add tasks for the day and mark them completed</p>
      </aside>

    </main>
    <script src="app.js"></script>
  </body>

</html>
