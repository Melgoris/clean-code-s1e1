<!DOCTYPE html>
<html>

  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>

  <body class="body">
    <header class="header">
      <h1 class="header__title hide">Todo App</h1>
      <figure class="header__figure">
        <img
        class="header__images"
        src="./eisenhower-matrix.jpg" 
        alt="Eisenhower matrix"
        >
        <figcaption class="hide">Eisenhower priority matrix — link to method</figcaption>
      </figure>
      
      <a 
        class="header__info-link" 
        target="_blank"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    
    <main class="todo-app">
      <section class="todo-app__add-item">
        <label class="todo-app__new-task-label" for="new-task">Add Item</label>
        <div class="todo-app__task-wrapper">
          <input 
            id="new-task" 
            class="input todo-app__task-input todo-app__add-task"
            type="text"
          >
          <button class="button todo-app__btn">Add</button>
        </div>
      </section>

      <section class="todo-app__todo">
        <h2 class="todo-app__section-title">Todo</h2>
        <ul class="todo-app__task-lists">
          <li class="todo-app__task-list">
            <article class="todo-app__item">
              <input class="input todo-app__checkbox-input" type="checkbox">
              <label class="todo-app__task-label">Pay Bills</label>
              <input type="text" class="input todo-app__task-input todo-app__task-input--saved">
              <button class="button todo-app__btn">Edit</button>
              <button class="button todo-app__btn-delete">
                <img 
                  src="./remove.svg" 
                  alt="Remove"
                  class="todo-app__delete-image"
                >
              </button>
            </article>
          </li>

          <li class="todo-app__task-list todo-app__task-list--edit">
            <article class="todo-app__item">
              <input class="input todo-app__checkbox-input" type="checkbox">
              <label class="todo-app__task-label todo-app__task-label--edit">Go Shopping</label>
              <input
                type="text" 
                value="Go Shopping" 
                class="input todo-app__task-input todo-app__task-input--edit"
              >
              <button class="button todo-app__btn">Save</button>
              <button class="button todo-app__btn-delete">
              <img 
                src="./remove.svg" 
                alt="Remove"
                class="todo-app__delete-image"
              >
              </button>
            </article>
          </li>
        </ul>
      </section>

      <section class="todo-app__completed">
        <h2 class="todo-app__section-title">Completed</h2>
        <ul class="todo-app__task-lists todo-app__task-lists--complite">
          <li class="todo-app__task-list" >
            <article class="todo-app__item">
              <input class="input todo-app__checkbox-input" type="checkbox" checked>
              <label class="todo-app__task-label todo-app__task-label--complited">See the Doctor</label>
              <input type="text" class="input todo-app__task-input todo-app__task-input--saved">
              <button class="button todo-app__btn">Edit</button>
              <button class="button todo-app__btn-delete">
              <img 
                src="./remove.svg" 
                alt="Remove"
                class="todo-app__delete-image"
              >
              </button>
            </article>
          </li>
        </ul>
      </section>
      
      <aside class="hide">
        <p>A simple Todo list where you can add tasks for the day and mark them completed</p>
      </aside>

    </main>
    <script src="app.js"></script>
  </body>

</html>
